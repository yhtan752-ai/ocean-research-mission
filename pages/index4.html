<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <title>OceanX: Mission Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <div id="mission-four-container">

        <div class="ocean-environment">
            <div class="swimmer shark"></div>
            <div class="swimmer shark shark-2"></div>
            <div class="swimmer fish fish-1"></div>
            <div class="swimmer fish fish-2"></div>
            <div class="swimmer fish fish-3"></div>
            <div class="swimmer wrasse wrasse-1"></div>
            <div class="swimmer wrasse wrasse-2"></div>
            <div class="coral-left"></div>
            <div class="coral-right"></div>
            <div class="seabed-plants">
                <div class="grass-blade"></div>
                <div class="grass-blade"></div>
                <div class="grass-blade"></div>
                <div class="grass-blade"></div>
            </div>
        </div>

        <div class="mission-layout-center">
            <div class="mission-header">Mission 1</div>

            <div class="quiz-interaction-row">
                <div class="character-wrapper-p2 protector-stage">
                    <model-viewer
                        class="protector-model"
                        src="../animations/askquestion.glb"
                        autoplay
                        camera-orbit="0deg 90deg auto"
                        interaction-prompt="none"
                        disable-zoom disable-pan disable-tap
                        shadow-intensity="0.9"
                        exposure="1.1"
                        environment-image="neutral"
                        style="width: 100%; height: 100%; display: block; --poster-color: transparent;">
                    </model-viewer>
                </div>

                <div class="quiz-board-bubble">
                    <div class="question-text">How many total sharks appeared in one frame?</div>

                    <div class="quiz-options-group">
                        <button class="btn-option" onclick="checkQuizAnswer(5)">5</button>
                        <button class="btn-option" onclick="checkQuizAnswer(6)">6</button>
                        <button class="btn-option" onclick="checkQuizAnswer(7)">7</button>
                    </div>

                    <div class="quiz-feedback" id="feedback-box">Select an option above!</div>
                </div>
            </div>
        </div>

    </div>

    <script src="../ocean-fx.js"></script>
    <script src="../script.js"></script>
</body>
</html>
