<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <title>OceanX: Mission Analysis</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <div id="mission-six-container">

        <div class="ocean-environment">
            <div class="swimmer shark"></div>
            <div class="swimmer shark shark-2"></div>
            <div class="swimmer fish fish-1"></div>
            <div class="swimmer fish fish-2"></div>
            <div class="swimmer fish fish-3"></div>
            <div class="swimmer wrasse wrasse-1"></div>
            <div class="swimmer wrasse wrasse-2"></div>
            <div class="coral-left"></div>
            <div class="coral-right"></div>
            <div class="seabed-plants">
                <div class="grass-blade"></div>
                <div class="grass-blade"></div>
                <div class="grass-blade"></div>
                <div class="grass-blade"></div>
            </div>
        </div>

        <div class="mission-layout-center">
            <div class="mission-header">Mission 1 Results</div>

            <div class="result-compare" id="result-compare">
                <div class="result-title">Human vs AI — Shark Count</div>
                <div class="result-cards">
                    <div class="result-card human">
                        <div class="result-label">You</div>
                        <div class="result-number" id="human-count">&ndash;</div>
                        <div class="result-sub">your MaxN guess</div>
                    </div>
                    <div class="result-vs">vs</div>
                    <div class="result-card ai">
                        <div class="result-label">AI Model &middot; YOLO</div>
                        <div class="result-number" id="ml-count">&ndash;</div>
                        <div class="result-sub">sharks detected</div>
                    </div>
                </div>
                <div class="result-verdict" id="result-verdict"></div>
            </div>

            <div class="summary-interaction-row">
                <div class="character-wrapper-p2 protector-stage">
                    <model-viewer
                        class="protector-model"
                        src="../animations/standingclap.glb"
                        autoplay
                        camera-orbit="0deg 90deg auto"
                        interaction-prompt="none"
                        disable-zoom disable-pan disable-tap
                        shadow-intensity="0.9"
                        exposure="1.1"
                        environment-image="neutral"
                        style="width: 100%; height: 100%; display: block; --poster-color: transparent;">
                    </model-viewer>
                </div>

                <div class="summary-dialog-stack" id="summary-speech-holder">
                    <button class="btn-proceed" id="proceed-mission-btn">Proceed to Mission 2 &rarr;</button>
                </div>
            </div>
        </div>

    </div>

    <script src="../ocean-fx.js"></script>
    <script src="../script.js"></script>
    <script>
        // Fill the Human vs AI comparison from what was stored on the quiz page.
        (function () {
            var h = null, m = null;
            try {
                h = localStorage.getItem("oceanx-human-count");
                m = localStorage.getItem("oceanx-ml-count");
            } catch (e) {}
            var panel = document.getElementById("result-compare");
            if (!panel) return;
            if (h === null || m === null) { panel.style.display = "none"; return; }

            document.getElementById("human-count").textContent = h;
            document.getElementById("ml-count").textContent = m;

            var verdict = document.getElementById("result-verdict");
            var hi = parseInt(h, 10), mi = parseInt(m, 10);
            if (hi === mi) {
                verdict.innerHTML = "Spot on — your count matched the AI! And the model did it <b>automatically, in seconds</b>.";
            } else {
                verdict.innerHTML = "The AI counted <b>" + mi + "</b>. Counting by hand is easy to slip on — a shark can appear for just a moment — but the model tracks them all <b>instantly and consistently</b>.";
            }
        })();
    </script>
</body>
</htm
