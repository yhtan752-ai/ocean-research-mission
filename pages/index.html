<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <title>OceanX: Research Mission</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <div id="experience-container">

        <div class="ocean-environment">
            <div class="swimmer shark"></div>
            <div class="swimmer shark shark-2"></div>
            <div class="swimmer fish fish-1"></div>
            <div class="swimmer fish fish-2"></div>
            <div class="swimmer fish fish-3"></div>
            <div class="swimmer fish fish-4"></div>
            <div class="swimmer fish fish-5"></div>
            <div class="swimmer fish fish-6"></div>
            <div class="swimmer fish fish-7"></div>
            <div class="swimmer fish fish-8"></div>
            <div class="swimmer wrasse wrasse-1"></div>
            <div class="swimmer wrasse wrasse-2"></div>
            <div class="swimmer wrasse wrasse-3"></div>
            <div class="coral-left"></div>
            <div class="coral-right"></div>
            <div class="coral-mid-1"></div>
            <div class="coral-mid-2"></div>
            <div class="seabed-plants seabed-3d">
                <div class="seagrass-3d">
                    <model-viewer class="seagrass-mv" src="../animations/seagrass.glb"
                        camera-orbit="0deg 90deg auto" interaction-prompt="none"
                        disable-zoom disable-pan disable-tap loading="eager"
                        style="width:100%;height:100%;"></model-viewer>
                </div>
                <div class="seagrass-3d">
                    <model-viewer class="seagrass-mv" src="../animations/seagrass.glb"
                        camera-orbit="0deg 90deg auto" interaction-prompt="none"
                        disable-zoom disable-pan disable-tap loading="eager"
                        style="width:100%;height:100%;"></model-viewer>
                </div>
                <div class="seagrass-3d">
                    <model-viewer class="seagrass-mv" src="../animations/seagrass.glb"
                        camera-orbit="0deg 90deg auto" interaction-prompt="none"
                        disable-zoom disable-pan disable-tap loading="eager"
                        style="width:100%;height:100%;"></model-viewer>
                </div>
            </div>
        </div>

        <div id="landing-screen">
            <div class="school-logos">
                <img src="../images/tp.png" alt="Temasek Polytechnic">
                <img src="../images/UMT.png" alt="Universiti Malaysia Terengganu">
                <img src="../images/oceanx.png" alt="OceanX">
            </div>
            <div class="title-main">Ocean Research</div>
            <div class="title-sub">Mission</div>
            <span class="landing-tag">An Immersive Shark Exploration Experience</span>
            <button class="btn-start" id="start-btn">Let's Go!</button>
        </div>

        <div id="mission-screen">
            <div class="mission-layout-center">

                <div class="character-wrapper protector-stage">
                    <model-viewer
                        id="protector-model"
                        class="protector-model"
                        \

                        
                        src="../animations/protector.glb"
                        autoplay
                        animation-name="Wave"
                        camera-orbit="0deg 90deg auto"
                        interaction-prompt="none"
                        disable-zoom disable-pan disable-tap
                        shadow-intensity="0.9"
                        exposure="1.1"
                        environment-image="neutral"
                        style="width: 100%; height: 100%; display: block; --poster-color: transparent;">
                    </model-viewer>
                </div>

                <div class="intro-right-col">
                    <div class="clock-sidebar" id="clock-module">
                        <div class="clock-time" id="clock-display">3</div>
                    </div>

                    <div class="photo-container">
                        <img src="../images/shark.jpg" id="target-img" alt="Target Species Environment">
                    </div>

                    <div class="dialog-container" id="dialog-holder">
                        <div class="speech-bubble" id="line-0">Welcome aboard, fellow scientists! I'm the Ocean Protector, Fin.</div>
                        <div class="speech-bubble" id="line-1">Today, we are going to explore a very important species.</div>
                        <div class="speech-bubble" id="line-2">Can you guess the species within 3 seconds?</div>
                    </div>

                    <button class="btn-next-page" id="next-page-btn">Continue &rarr;</button>
                </div>

            </div>
        </div>

    </div>

    <script src="../ocean-fx.js"></script>
    <script src="../script.js"></script>
</body>
</html>
